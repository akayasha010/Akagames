<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Miestilo.css">
</head>

<body>
    <header class="encabezado">
        <h1 class="titulo">Compra</h1>
    </header>

    <main class="container d-flex flex-row justify-content-evenly mt-5">


        <div class=" portada">
            <img src="images/gta.jpg" alt="juego">
        </div>

        <div class="fila d-flex flex-column">
            <span class="etiqueta">Entrega Estandar 3-4 dias
            </span>



            <div class="fila">
                <span class="etiqueta">Envio</span>
                <div class="form-field">
                    <label for="exampleFormControlInput1" class="form-label"></label>
                    <input type="email" class="form-control" id="exampleFormControlInput1"
                        placeholder="Agregar Direccion">
                    <div class="form-text">
                    </div>

                </div>
            </div>

            <div class="fila col-md-6">
                <span class="etiqueta">PAGO</span>
                <div class="form-field">
                    <label for="exampleFormControlInput1" class="form-label"></label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Visa *1234">
                    <div class="form-text">
                    </div>

                </div>
            </div>

            <div class="fila col.col-md-6">
                <span class="etiqueta">Promociones</span>
                <div class="form-field">
                    <label for="exampleFormControlInput1" class="form-label"></label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Codigo">
                    <div class="form-text">
                    </div>
                </div>
            </div>
            <div class=" col-md-6 fila">
                <span class="etiqueta">Articulos</span>
                <span class="valor">videojuego</span>
            </div>
            <div class="articulo">
                <div class="info">
                    <span>Precio <br>1,999</span>
                </div>
            </div>

            <a href="final.html" class="boton">comprar</a>
        </div>
    </main>
    <footer>
        <p>pagina hecha por Rey angel de jesus zamarripa herrera</p>
    </footer>
</body>

</html>
